name: Export Android signing tools
on:
  push:
    paths: [".github/workflows/android-tools.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Collect installed Android build tools
        shell: bash
        run: |
          mkdir tools
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner.jar | sort -V | tail -n 1)
          test -n "$signer"
          cp "$signer" tools/apksigner.jar
          cp "$(dirname "$(dirname "$signer")")/aapt2" tools/aapt2
      - uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: tools/
          if-no-files-found: error
          retention-days: 30
